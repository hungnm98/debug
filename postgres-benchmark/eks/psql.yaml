apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: postgres-benchmark
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: postgres-ebs-test
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: postgres-ebs-test
      annotations:
        sidecar.istio.io/inject: 'false'
    spec:
      nodeSelector:
        remi: debug
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      tolerations:
      - key: remi
        operator: Equal
        value: debug
        effect: NoSchedule
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
        imagePullPolicy: IfNotPresent
        args:
        - postgres
        - -c
        - config_file=/etc/postgresql/postgresql.conf
        env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_DB
          value: postgres
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_INITDB_ARGS
          value: --auth-host=scram-sha-256 --auth-local=trust
        - name: POSTGRES_HOST_AUTH_METHOD
          value: scram-sha-256
        - name: POSTGRES_PASSWORD_FILE
          value: /run/postgres-secrets/postgres-password
        - name: MONITOR_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-auth
              key: monitor-password
        ports:
        - name: postgres
          containerPort: 5432
        resources:
          requests:
            cpu: '24'
            memory: 48Gi
          limits:
            cpu: '24'
            memory: 48Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: config
          mountPath: /etc/postgresql
          readOnly: true
        - name: init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        - name: auth
          mountPath: /run/postgres-secrets
          readOnly: true
        - name: shm
          mountPath: /dev/shm
        - name: scripts
          mountPath: /opt/benchmark
          readOnly: true
        startupProbe:
          exec:
            command:
            - sh
            - -ec
            - pg_isready -h 127.0.0.1 -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 90
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - pg_isready -h 127.0.0.1 -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          exec:
            command:
            - sh
            - -ec
            - pg_isready -h 127.0.0.1 -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
          initialDelaySeconds: 30
      - name: postgres-exporter
        image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
        args:
        - --collector.stat_statements
        - --collector.long_running_transactions
        - --extend.query-path=/etc/postgres-exporter/queries.yml
        env:
        - name: DATA_SOURCE_URI
          value: 127.0.0.1:5432/postgres?sslmode=disable
        - name: DATA_SOURCE_USER
          value: postgres_metrics
        - name: DATA_SOURCE_PASS_FILE
          value: /run/postgres-secrets/monitor-password
        ports:
        - name: metrics
          containerPort: 9187
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: monitor-auth
          mountPath: /run/postgres-secrets
          readOnly: true
        - name: config
          mountPath: /etc/postgres-exporter
          readOnly: true
        readinessProbe:
          httpGet:
            path: /metrics
            port: 9187
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /metrics
            port: 9187
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 6
      volumes:
      - name: config
        configMap:
          name: postgres-config
      - name: init
        configMap:
          name: postgres-config
          items:
          - key: 10-monitor.sh
            path: 10-monitor.sh
          defaultMode: 365
      - name: auth
        secret:
          secretName: postgres-auth
          defaultMode: 288
          items:
          - key: postgres-password
            path: postgres-password
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
      - name: monitor-auth
        secret:
          secretName: postgres-auth
          defaultMode: 288
          items:
          - key: monitor-password
            path: monitor-password
      - name: scripts
        configMap:
          name: benchmark-scripts
          defaultMode: 365
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: postgres-ebs-test
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: postgres-io2
      resources:
        requests:
          storage: 100Gi
